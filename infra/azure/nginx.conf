# nginx inside the web container on the Azure server. Caddy terminates HTTPS
# for biztrack.page and hands every request here over Docker's private network.
server {
    listen 80;
    server_name _;

    root /var/www/web;
    index index.html;

    # Vite fingerprints everything under /assets, so a file there never changes.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The React app: any path that is not a file is a client-side route.
    # index.html itself must never be cached, or a deploy would keep serving
    # the old bundle names.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # API → php-fpm. The PHP files live in the app container, not here, so the
    # script path is named outright rather than looked up on this filesystem.
    location /api {
        try_files /nonexistent /index.php$is_args$args;
    }
    location = /index.php {
        fastcgi_pass app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/api/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/api/public;
        fastcgi_read_timeout 120s;
    }

    # Uploaded documents are served by the API with a permission check, never
    # straight from disk.
    location /storage { deny all; }

    client_max_body_size 12m;
    server_tokens off;
}
