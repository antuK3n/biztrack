; Production PHP settings for the Azure server.
; Uploads: the API accepts documents up to 10 MB (DocumentController), nginx
; allows a 12 MB body, so PHP must allow at least that much.
upload_max_filesize = 12M
post_max_size = 13M
memory_limit = 256M
expose_php = Off
date.timezone = Asia/Manila

; The code only changes on a rebuild, so PHP never needs to re-check files.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 96
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
