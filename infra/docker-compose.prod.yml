# BizTrack production stack — MISD box / defense-day laptop (master plan §4).
#   docker compose -f infra/docker-compose.prod.yml up -d --build
# nginx serves web/dist and proxies /api to php-fpm. No internet required after build.
services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - '80:80'
    volumes:
      - ./nginx/biztrack.conf:/etc/nginx/conf.d/default.conf:ro
      - ../web/dist:/var/www/web:ro
      - appstorage:/var/www/api/storage
    depends_on:
      - app

  app:
    build:
      context: ..
      dockerfile: infra/php/Dockerfile
    env_file: ../api/.env.production
    volumes:
      - appstorage:/var/www/api/storage
    depends_on:
      db:
        condition: service_healthy

  queue:
    build:
      context: ..
      dockerfile: infra/php/Dockerfile
    command: php artisan queue:work --tries=3
    env_file: ../api/.env.production
    volumes:
      - appstorage:/var/www/api/storage
    depends_on:
      - app

  scheduler:
    build:
      context: ..
      dockerfile: infra/php/Dockerfile
    command: php artisan schedule:work
    env_file: ../api/.env.production
    volumes:
      - appstorage:/var/www/api/storage
    depends_on:
      - app

  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: biztrack
      POSTGRES_USER: biztrack
      POSTGRES_PASSWORD: ${DB_PASSWORD:-biztrack}
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U biztrack']
      interval: 5s
      retries: 10

volumes:
  dbdata:
  appstorage:
