; Dev-server overrides for `php artisan serve`, loaded via PHP_INI_SCAN_DIR.
; PHP capped uploads at 2M while DocumentController validates max:10240 (10 MB),
; so every file between the two was rejected by PHP before Laravel saw it and the
; applicant got a raw 413. A phone photo of a barangay clearance is 2-5 MB.
; Not a global php.ini change: this is scanned only for the dev server.
upload_max_filesize = 12M
post_max_size = 13M
