; Keep PHP's own diagnostics OUT of the HTTP response body.
;
; `php artisan serve` runs PHP's built-in server, whose router (server.php)
; writes a request log line to php://stdout. When nothing is reading that
; stdout any more — the launching shell exited, a nohup pipe lost its reader —
; every write fails and PHP raises:
;
;   Notice: file_put_contents(): Write of N bytes failed with errno=32 Broken pipe
;
; With display_errors on for CLI, that notice is emitted BEFORE the response, so
; the client receives
;
;   <br /><b>Notice</b>: ... <br />{"message":"Invalid credentials."}
;
; which is not JSON. The frontend cannot parse it and reports "We couldn't reach
; BizTrack" — so a healthy API that returns a correct 422 looks like a network
; outage, and login is impossible. It also printed the absolute filesystem path
; on a public tunnel, which is an information leak on top of the breakage.
;
; display_errors=Off fixes both: the response stays clean JSON and no path is
; disclosed. log_errors stays on so the diagnostics are not lost, they just go
; to the error log where they belong rather than into somebody's API response.
display_errors = Off
log_errors = On
